<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="600" viewBox="0 0 1220 600"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="25" y="32" font-family="Times New Roman" font-size="23" font-weight="bold">Fit Nutrition Supply: поток входа</text>
<rect x="30" y="110" width="220" height="85" fill="white" stroke="black"/>
<text x="140.0" y="148.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Регистрация</text>
<text x="140.0" y="166.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Имя, email, пароль</text>
<rect x="340" y="110" width="220" height="85" fill="white" stroke="black"/>
<text x="450.0" y="148.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Обязательный профиль</text>
<text x="450.0" y="166.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">3 шага + сводка</text>
<rect x="650" y="110" width="220" height="85" fill="white" stroke="black"/>
<text x="760.0" y="148.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Дашборд</text>
<text x="760.0" y="166.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Приветствие и профиль</text>
<rect x="960" y="110" width="220" height="85" fill="white" stroke="black"/>
<text x="1070.0" y="148.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Настройте ваш план</text>
<text x="1070.0" y="166.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Меню + расчёт корзины</text>
<rect x="30" y="350" width="220" height="70" fill="white" stroke="black"/>
<text x="140.0" y="390.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Повторный вход</text>
<polygon points="450.0,320 560,385.0 450.0,450 340,385.0" fill="white" stroke="black"/>
<text x="450.0" y="381.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Профиль</text>
<text x="450.0" y="399.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">сохранён?</text>
<text x="1015.0" y="382.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Прямой переход к плану</text>
<text x="1015.0" y="400.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">без профиля запрещён</text>
<text x="1015.0" y="418.0" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">в интерфейсе и в API</text>
<text x="605.0" y="523.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Профиль хранится отдельно в SQLite. Черновик шагов хранится в браузере по аккаунту.</text>
<text x="605.0" y="541.5" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="normal">Возврат и перезагрузка не стирают черновик. План сохраняет снимок параметров.</text>
<polyline points="250,152 340,152" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="560,152 650,152" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="605.0" y="143.0" text-anchor="middle" font-family="Times New Roman" font-size="13">Сохранить</text>
<polyline points="870,152 960,152" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="1070,195 1070,265 760,265 760,195" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="915.0" y="256.0" text-anchor="middle" font-family="Times New Roman" font-size="13">На главную</text>
<polyline points="250,385 340,385" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="450,320 450,195" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="458.0" y="248.5" text-anchor="start" font-family="Times New Roman" font-size="13">Нет</text>
<polyline points="560,385 760,385 760,195" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="660.0" y="376.0" text-anchor="middle" font-family="Times New Roman" font-size="13">Да</text>
