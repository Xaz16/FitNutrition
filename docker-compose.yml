services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fns
      POSTGRES_PASSWORD: fns
      POSTGRES_DB: fit_nutrition
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fns -d fit_nutrition"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
